<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffdde1; /* Fallback */
            background-image: linear-gradient(to top, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden; /* Prevent scrolling initially */
            color: #d63384;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1, h2 {
            font-family: 'Dancing Script', cursive;
        }

        .hidden {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .fade-in {
            animation: fadeIn 1.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #d6336c;
        }

        .timeline-item {
            margin: 20px 0;
            padding: 15px;
            border-left: 3px solid #ff4d6d;
            background: #fff0f3;
            border-radius: 0 10px 10px 0;
            text-align: left;
        }

        .photo-frame {
            width: 100%;
            height: 250px;
            background-color: #ddd;
            border-radius: 15px;
            margin: 20px 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .love-tag {
            font-size: 1.5rem;
            color: #c9184a;
            margin-top: 30px;
            font-weight: bold;
            font-family: 'Dancing Script', cursive;
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.5);
            animation: float 6s linear infinite;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        
        <div id="step-1">
            <h1>Hey you...</h1>
            <p>I have something to show you.</p>
            <button class="btn" onclick="goToStep(2)">Tap Here ❤️</button>
        </div>

        <div id="step-2" class="hidden">
            <h2>Our Journey</h2>
            
            <div class="timeline-item">
                <strong>Year we met</strong>
                <p>2022</p>
            </div>

            <div class="timeline-item">
                <strong>Year we chose each other</strong>
                <p>2025 Dec 5</p>
            </div>

            <p style="margin-top: 20px;">But that's not all...</p>
            <button class="btn" onclick="revealPhoto()">Suprise reveal of photo 📸</button>
        </div>

        <div id="step-3" class="hidden">
            <div class="photo-frame">
                <img src="1767247207578.jpg" alt="Us">
            </div>
            <button class="btn" onclick="goToStep(4)">Click if you love me 🥺</button>
        </div>

        <div id="step-4" class="hidden">
            <h2>Will you be my Valentine?</h2>
            <br>
            <button class="btn" onclick="handleYes()">YES</button>
            <button class="btn" id="noBtn" onclick="handleNo()">NO</button>
            <p id="response-text" style="height: 20px; color: #d63384; font-weight: bold;"></p>
        </div>

        <div id="step-5" class="hidden">
            <h2>I knew it! 😁</h2>
            <br>
            <button class="btn" onclick="showFinalSurprise()">Click here for a surprise 🌙</button>
        </div>

        <div id="step-6" class="hidden">
            <h3>The Moon on Your Birthday</h3>
            <div class="photo-frame" style="background: #000;">
                <img src="Picsart_26-02-02_18-38-24-585.jpg" alt="Moon Phase">
            </div>
            <p class="love-tag">I love you to the moon and back ❤️</p>
        </div>

    </div>

    <script>
        // Navigation Logic
        function goToStep(stepNum) {
            // Hide all steps currently visible
            document.querySelectorAll('.container > div').forEach(div => {
                if(!div.classList.contains('hidden')) div.classList.add('hidden');
            });

            // Show new step
            const nextStep = document.getElementById(`step-${stepNum}`);
            nextStep.classList.remove('hidden');
            nextStep.classList.add('fade-in');
        }

        function revealPhoto() {
            goToStep(3);
        }

        // Yes/No Logic
        function handleYes() {
            goToStep(5);
        }

        function handleNo() {
            const noBtn = document.getElementById('noBtn');
            const responseText = document.getElementById('response-text');
            
            // Change text as requested
            responseText.innerText = "Please say yes 🙃";
            
            // Optional: Move button slightly to be playful
            const randomX = Math.random() * 50 - 25;
            const randomY = Math.random() * 50 - 25;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function showFinalSurprise() {
            goToStep(6);
            createHearts(); // Extra confetti effect
        }

        // Background Hearts Effect
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-bg');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 3 + 2 + 's';
                heart.style.fontSize = Math.random() * 20 + 10 + 'px';
                container.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        }
        
        // Start background animation
        setInterval(createHearts, 500);

    </script>
</body>
</html>
